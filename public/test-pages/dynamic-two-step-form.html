<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JobPilot Dynamic Two Step Form Test</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f6f8fb;
        color: #17202f;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      }

      main {
        width: min(860px, calc(100% - 32px));
        margin: 32px auto;
        display: grid;
        gap: 18px;
      }

      section,
      form {
        display: grid;
        gap: 16px;
        border: 1px solid #dce4ef;
        border-radius: 10px;
        background: #ffffff;
        padding: 20px;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      label {
        display: grid;
        gap: 6px;
        font-weight: 700;
      }

      input,
      textarea {
        min-height: 40px;
        border: 1px solid #cfd8e5;
        border-radius: 8px;
        padding: 9px 10px;
        font: inherit;
      }

      textarea {
        min-height: 96px;
      }

      button {
        justify-self: start;
        min-height: 40px;
        border: 0;
        border-radius: 8px;
        background: #18b487;
        color: #ffffff;
        padding: 0 14px;
        font-weight: 800;
        cursor: pointer;
      }

      pre {
        overflow: auto;
        max-height: 240px;
        border-radius: 10px;
        background: #111827;
        color: #d1fae5;
        padding: 14px;
      }

      .hint {
        color: #667389;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>Dynamic Two Step Form</h1>
        <p class="hint">JobPilot should listen for DOM changes after you click the page's own Next Step button.</p>
      </section>

      <form id="dynamic-form">
        <div id="step-root"></div>
      </form>

      <section>
        <h2>Test Fill Package</h2>
        <pre id="testPackage"></pre>
      </section>
    </main>

    <script>
      const stepRoot = document.querySelector('#step-root');
      const packageData = {
        steps: [
          { field: 'Full Name', selector: '#dynamicName', value: 'Dynamic User', confidence: '高' },
          { field: 'Email', selector: '#dynamicEmail', value: 'dynamic@example.com', confidence: '高' },
          { field: 'Project Name', selector: '#dynamicProject', value: 'Dynamic Project Scanner', confidence: '高' },
          { field: 'Project Description', selector: '#dynamicDescription', value: 'Observed after user clicked Next Step.', confidence: '高' }
        ]
      };

      function renderStepOne() {
        stepRoot.innerHTML = `
          <h2>Step 1 - Personal Info</h2>
          <div class="grid">
            <label>Full Name <input id="dynamicName" name="full_name" autocomplete="name" /></label>
            <label>Email <input id="dynamicEmail" name="email" type="email" autocomplete="email" /></label>
          </div>
          <button id="nextStep" type="button">Next Step</button>
        `;
        document.querySelector('#nextStep').addEventListener('click', renderStepTwo);
      }

      function renderStepTwo() {
        stepRoot.innerHTML = `
          <h2>Step 2 - Project</h2>
          <label>Project Name <input id="dynamicProject" name="project_name" /></label>
          <label>Project Description <textarea id="dynamicDescription" name="project_description"></textarea></label>
        `;
      }

      document.querySelector('#testPackage').textContent = JSON.stringify(packageData, null, 2);
      renderStepOne();
    </script>
  </body>
</html>
