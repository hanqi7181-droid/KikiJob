<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JobPilot Generic Autofill Test</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f6f8fb;
        color: #17202f;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      }

      main {
        width: min(900px, calc(100% - 32px));
        margin: 32px auto;
        display: grid;
        gap: 18px;
      }

      form,
      section {
        display: grid;
        gap: 16px;
        border: 1px solid #dce4ef;
        border-radius: 10px;
        background: #ffffff;
        padding: 20px;
      }

      h1,
      p {
        margin: 0;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      label {
        display: grid;
        gap: 6px;
        font-weight: 700;
      }

      input,
      select,
      textarea {
        min-height: 40px;
        border: 1px solid #cfd8e5;
        border-radius: 8px;
        padding: 9px 10px;
        font: inherit;
      }

      textarea {
        min-height: 96px;
      }

      fieldset {
        border: 1px solid #dce4ef;
        border-radius: 8px;
        display: grid;
        gap: 8px;
      }

      .inline {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
      }

      .inline label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-weight: 500;
      }

      .hint {
        color: #667389;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>JobPilot Generic Autofill Test</h1>
        <p class="hint">This page covers text, textarea, email, tel, number, date, native select, checkbox, and radio. It has no submit button.</p>
      </section>

      <form id="autofill-test-form">
        <input type="hidden" name="csrf_token" value="fake-token" />

        <div class="grid">
          <label for="testFullName">
            Full Name
            <input id="testFullName" name="full_name" type="text" autocomplete="name" placeholder="Full name" />
          </label>

          <label for="testEmail">
            Email
            <input id="testEmail" name="email" type="email" autocomplete="email" placeholder="email@example.com" />
          </label>

          <label for="testPhone">
            Mobile Phone
            <input id="testPhone" name="phone" type="tel" autocomplete="tel" placeholder="+86 138 0000 0000" />
          </label>

          <label for="testSalary">
            Expected Salary
            <input id="testSalary" name="salary" type="number" placeholder="20000" />
          </label>

          <label for="testStartDate">
            Available Start Date
            <input id="testStartDate" name="available_date" type="date" />
          </label>

          <label for="testCity">
            Preferred City
            <select id="testCity" name="city">
              <option value="">Select city</option>
              <option value="shenzhen">Shenzhen</option>
              <option value="hong-kong">Hong Kong</option>
              <option value="shanghai">Shanghai</option>
              <option value="hangzhou">Hangzhou</option>
            </select>
          </label>

          <label for="testPrefilled">
            Prefilled Field
            <input id="testPrefilled" name="prefilled_field" type="text" value="Do not overwrite me" />
          </label>
        </div>

        <label for="testSummary">
          Personal Summary
          <textarea id="testSummary" name="summary" placeholder="Summary"></textarea>
        </label>

        <fieldset>
          <legend>Application Type</legend>
          <div class="inline">
            <label><input id="typeInternship" type="radio" name="application_type" value="internship" /> Internship</label>
            <label><input id="typeGraduate" type="radio" name="application_type" value="graduate" /> Graduate</label>
          </div>
        </fieldset>

        <fieldset>
          <legend>Preferred Track</legend>
          <div class="inline">
            <label><input id="trackAiProduct" type="checkbox" name="track_ai_product" value="ai_product" /> AI Product</label>
            <label><input id="trackData" type="checkbox" name="track_data" value="data" /> Data Analysis</label>
          </div>
        </fieldset>
      </form>
    </main>
  </body>
</html>
